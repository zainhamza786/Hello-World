<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="card">
    <h2>Welcome Back</h2>
    <input type="email" placehold="email">
    <input type="Password" placehold="Password">
    <button>Sign in</button>
    </div>
    <style>
        body{
            display: grid;
            place-items: center;
            min-height: 80vh;
            background: linear-gradient(135deg, #2563eb,#7c3aeb);
        }
        .card{
            width: 220px;
            padding: 10px;
            border-radius: 20px;
            backdrop-filter: blur(18px);
            background: rgba(255,255,255, .12);
            border: 1x solid rgba(255,255,255, .2);
        }
        
        </style>
